name: MIPS3 Testing with LuaJIT-test-cleanup

on:
  push:
    branches:
      - mips3

jobs:
  test-mips3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout LuaJIT repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips64el-linux-gnuabi64 qemu-user-static
      
      - name: Build LuaJIT for MIPS3
        run: |
          cd src
          make clean
          make CROSS=mips64el-linux-gnuabi64- \
               HOST_CC="gcc -m64" \
               TARGET_CFLAGS="-march=mips3" \
               CCOPT_mips="-march=mips3" \
               TARGET_SYS=Linux
      
      - name: Checkout LuaJIT-test-cleanup
        uses: actions/checkout@v4
        with:
          repository: LuaJIT/LuaJIT-test-cleanup
          path: test-suite
      
      - name: Run tests with qemu-mips64el
        run: |
          cd test-suite
          qemu-mips64el-static -cpu loongson2f ../src/luajit test/test.lua
